project_id = "fzsfizqkolkxkorgvtcl"

# OAuth start/data functions require a valid Supabase JWT.
[functions.gmail-auth-start]
verify_jwt = true

# Google redirects the browser here with NO Supabase JWT — this function is
# protected instead by an HMAC-signed `state` (see _shared/shared.ts).
[functions.gmail-auth-callback]
verify_jwt = false

[functions.gmail-sync]
verify_jwt = true

[functions.gmail-action]
verify_jwt = true

# ---- Hal (voice assistant) ----
[functions.hal-chat]
verify_jwt = true

[functions.hal-voice]
verify_jwt = true

[functions.hal-ears]
verify_jwt = true

# Apple Calendar fetches the ICS feed with no headers — it is protected by the HMAC
# token in the URL instead. NOTE: every dashboard / MCP redeploy of hal-ics flips
# "Verify JWT" back ON; re-toggle it OFF (Edge Functions → hal-ics → Settings) or the
# iPhone subscription starts getting 401s.
[functions.hal-ics]
verify_jwt = false
